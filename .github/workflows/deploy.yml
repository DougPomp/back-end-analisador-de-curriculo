
name: Deploy Analisador de Currículo

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: zeronauta/analisador-de-curriculo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da imagem da aplicação
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.0.0 # Versão fixada (verificar a mais recente tag estável)
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Garante que o diretório do projeto exista
            mkdir -p ~/analisador-de-curriculo
            cd ~/analisador-de-curriculo

            # Faz o pull do repositório para obter o docker-compose.yml mais recente
            git pull origin main

            # A CHAVE OPENAI_API_KEY DEVE SER CONFIGURADA NO AMBIENTE DO SERVIDOR VPS
            # E O docker-compose.yml DEVE SER AJUSTADO PARA PASSÁ-LA AO CONTÊINER.
            # Exemplo de como o docker-compose.yml poderia ser:
            # services:
            #   app:
            #     image: ${{ env.DOCKER_IMAGE_NAME }}:latest
            #     environment:
            #       - OPENAI_API_KEY=${OPENAI_API_KEY} # Esta variável é lida do ambiente do host
            #     ports:
            #       - "5000:5000"
            # (O comando abaixo que criava o .env foi removido)
            # # echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env

            # Baixa a imagem mais recente da aplicação
            docker compose pull app # Garante que o serviço 'app' esteja definido no docker-compose.yml

            # Sobe apenas o serviço da aplicação
            docker compose up -d --remove-orphans

            # Limpa imagens Docker antigas
            docker image prune -af
